<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; font-family: var(--font); background: var(--surface); }
  .dm-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; background: var(--screen); border-bottom: 1px solid var(--line); }
  .dm-bar b { font-size: 13px; }
  .dm-bar small { color: var(--muted); font-size: 11px; font-weight: 700; }
  .dm-grp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .dm-bar button { border: 0; border-radius: 999px; padding: 8px 13px; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
  .dm-bar button[aria-pressed="true"] { background: var(--fg); color: var(--screen); box-shadow: none; }
  .dm-bar.shut .dm-more, .dm-bar.shut .dm-note { display: none; }
  .dm-bar button.reset { background: var(--fg); color: var(--screen); box-shadow: none; }
  .dm-clk { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .dm-stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; gap: 18px; padding: 10px; }
  .dm-ph[hidden] { display: none; }
  .dm-ph { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .dm-ph h2 { margin: 0; font-size: 13px; font-weight: 800; }
  .dm-ph h2 i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .dm-frame { border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 2px var(--line), 0 6px 20px rgba(0,0,0,.12); background: var(--screen); }
  .dm-frame iframe { width: 390px; height: 844px; border: 0; transform-origin: 0 0; display: block; }
</style>
</head>
<body>
<div class="dm-bar">
  <div class="dm-grp"><b>デモ</b><button id="dm-toggle" type="button" aria-expanded="true">操作を閉じる</button><small class="dm-note">ここでの記録は、この画面の中だけ。リセットか開き直しで、すべて消えます</small></div>
  <div class="dm-grp dm-more"><span class="dm-clk" id="clk"></span><button data-adv="10">+10分</button><button data-adv="60">+1時間</button><button data-adv="next">あすの朝</button><button data-adv="0">いまに戻す</button></div>
  <div class="dm-grp"><small>見る画面</small><button data-view="h" aria-pressed="true">彼女</button><button data-view="y" aria-pressed="false">彼氏</button><button data-view="both" aria-pressed="false">ふたり</button></div>
  <div class="dm-grp dm-more"><small>天気</small><button id="rain" data-rain="1" aria-pressed="false">雨の日にする</button></div>
  <div class="dm-grp dm-more"><small>月のポイント</small><button class="reset" data-pts="0">はじめから</button><button data-pts="20">20</button><button data-pts="50">50</button><button data-pts="90">90</button><button data-pts="99">99</button><button data-pts="300">満月3つ</button><button data-pts="600">満月6つ</button><button data-pts="2000">満月20個</button></div>
</div>
<div class="dm-stage" id="stage">
  <div class="dm-ph"><h2><i style="background:var(--pink-deep)"></i>彼女</h2><div class="dm-frame" id="fh"><iframe title="彼女" id="f-h"></iframe></div></div>
  <div class="dm-ph"><h2><i style="background:var(--mint-deep)"></i>彼氏</h2><div class="dm-frame" id="fy"><iframe title="彼氏" id="f-y"></iframe></div></div>
</div>
<script type="module">
import * as C from './js/crypto.js';
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const MIN = 60000, DAY = 86400000;
const host = { offset: 0, bus: null, ls: {}, rain: false };
window.__demo = host;
const NAME = { h: '彼女', y: '彼氏' };

const EMPTY = () => ({ messages: [], events: [], days: [], pats: [], stock: [], qcards: [], answers: [], guesses: [], boxes: [], marks: [], items: [], moon: [], reads: [], profiles: [], shared: [] });

async function seedMoon(key, pts) {
  const rows = [];
  let k = 1, left = pts, i = 0;
  const add = async (kind) => {
    const d = new Date(Date.now() - k * DAY); d.setHours(21, 0, 0, 0); k += 1;
    const gap = (kind === 'sync' ? 3 : 40) * MIN;
    const swap = kind === 'late' && k % 2 === 0; // おまたせは、ふたりが交互に
    const h = d.getTime() + (swap ? gap : 0), y = d.getTime() + (swap ? 0 : gap);
    rows.push({ id: `seed-h-${k}`, ...(await C.encryptJson(key, 'moon', { at: h })), from: 'demo-h' });
    rows.push({ id: `seed-y-${k}`, ...(await C.encryptJson(key, 'moon', { at: y })), from: 'demo-y' });
  };
  while (left >= 5) {
    if (pts >= 100 && i % 5 === 4) { await add('late'); left -= 1; } else { await add('sync'); left -= 5; } // 満月の数字が、おもしろくなるように、ときどき「おまたせ」を混ぜる
    i += 1;
  }
  while (left >= 1) { await add('late'); left -= 1; }
  return rows;
}

let busy = false;
async function reset(pts = 0) {
  if (busy) return;
  busy = true;
  const bytes = C.newSecret();
  const key = await C.importKey(bytes);
  host.offset = 0;
  host.rain = false;
  $('#rain').setAttribute('aria-pressed', 'false'); $('#rain').textContent = '雨の日にする';
  host.bus = { data: EMPTY(), subs: new Set(), n: 0 };
  host.bus.data.moon = await seedMoon(key, pts);
  ['h', 'y'].forEach((r) => {
    host.ls[r] = { 'app.key': C.toB64(bytes), 'app.name': NAME[r], 'app.seq': 'demo', 'app.auto': '0', 'app.role': r };
    $(`#f-${r}`).src = `index.html?demo=${r}&t=${Date.now()}`;
  });
  clock();
  busy = false;
}
const now = () => new Date(Date.now() + host.offset);
function clock() { const d = now(); $('#clk').textContent = `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function tick() { clock(); ['h', 'y'].forEach((r) => { try { $(`#f-${r}`).contentWindow.dispatchEvent(new Event('demo-tick')); } catch (e) { /* まだ開いていない */ } }); }

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.rain) { host.rain = !host.rain; b.setAttribute('aria-pressed', String(host.rain)); b.textContent = host.rain ? '雨の日をやめる' : '雨の日にする'; }
  else if (b.dataset.pts != null) reset(Number(b.dataset.pts));
  else if (b.dataset.adv != null) {
    if (b.dataset.adv === 'next') { const d = now(); d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0); host.offset = d.getTime() - Date.now(); }
    else if (b.dataset.adv === '0') host.offset = 0;
    else host.offset += Number(b.dataset.adv) * MIN;
    tick();
  }
});

// 見る画面: 彼女・彼氏のどちらか1台を大きく(ふだん)、または、2台を並べる。どちらも裏で動いている
let view = ['h', 'y', 'both'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'h';
function applyView() {
  $('#fh').parentElement.hidden = view === 'y';
  $('#fy').parentElement.hidden = view === 'h';
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
  fit();
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (!b) return; view = b.dataset.view; history.replaceState(null, '', `#${view}`); applyView(); });
// 画面の大きさに合わせて、縮めて置く
function fit() {
  const st = $('#stage'); const n = view === 'both' ? 2 : 1;
  const W = st.clientWidth - 28 - 18 * (n - 1), H = st.clientHeight - 20 - 24;
  const s = Math.max(0.3, Math.min(n === 1 ? 1.4 : 1, W / n / 390, H / 844));
  ['h', 'y'].forEach((r) => {
    const f = $(`#f-${r}`); f.style.transform = `scale(${s})`;
    const fr = f.parentElement; fr.style.width = `${390 * s}px`; fr.style.height = `${844 * s}px`;
  });
}
window.addEventListener('resize', fit);
const bar = document.querySelector('.dm-bar');
function shut(v) { bar.classList.toggle('shut', v); $('#dm-toggle').textContent = v ? '操作を開く' : '操作を閉じる'; $('#dm-toggle').setAttribute('aria-expanded', String(!v)); fit(); }
$('#dm-toggle').addEventListener('click', () => shut(!bar.classList.contains('shut')));
if (window.innerWidth < 700) shut(true); // 小さい画面では、画面を広く使うため、操作をたたんでおく
applyView();
setInterval(clock, 15000);
reset(0);
</script>
</body>
</html>
